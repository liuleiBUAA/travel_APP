<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#dfe4ea;padding:36px;}
.grid{display:flex;flex-wrap:wrap;gap:44px;justify-content:center;}
.col{display:flex;flex-direction:column;align-items:center;}
.label{font-size:14px;font-weight:700;color:#3a3a44;margin-bottom:12px;letter-spacing:.5px;}
.phone{width:340px;height:720px;border-radius:40px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.20);border:9px solid #16161a;background:#000;}
.screen{height:100%;overflow:hidden;background:#f7f8fa;position:relative;}
.sb{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:#1a1a1a;}
.sb .r{display:flex;gap:5px;}

/* ===== A 方案设计系统：极简白底 ===== */
/* 品牌色珊瑚只点缀 */
:root{ --brand:#ff6a5c; --brand-soft:#fff0ee; --ink:#1a1a1a; --sub:#666; --faint:#999; --line:#eee; --bg:#f7f8fa; }
.body{padding:16px;height:680px;overflow-y:auto;}
.h1{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.25;}
.h1-sub{font-size:14px;color:var(--faint);margin-top:6px;}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:14px;}
.sec-title{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin:22px 2px 12px;display:flex;justify-content:space-between;align-items:center;}
.sec-title .more{font-size:13px;font-weight:500;color:var(--faint);}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;background:#f2f3f5;color:var(--sub);margin:3px 4px 3px 0;}
.chip.on{background:var(--brand);color:#fff;}
.chip.brandsoft{background:var(--brand-soft);color:var(--brand);font-weight:600;}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-size:15px;font-weight:700;background:var(--brand);color:#fff;border:none;}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.arrow{color:var(--faint);font-size:16px;}
.muted{color:var(--faint);font-size:13px;}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const sb = `<div class="sb"><span>9:41</span><span class="r">📶 🔋</span></div>`;
function phone(label, inner){
  return `<div class="col"><div class="label">${label}</div><div class="phone"><div class="screen">${sb}<div class="body">${inner}</div></div></div></div>`;
}
const P = [];

/* 1. 首页 home */
P.push(phone("① 首页", `
<div style="padding:8px 2px 0;"><div class="h1">你好，浩然 👋</div><div class="h1-sub">下一段旅程，从这里开始</div></div>
<div style="margin-top:22px;display:flex;flex-direction:column;gap:14px;">
  <div class="card" style="border-left:4px solid var(--brand);display:flex;align-items:center;gap:14px;padding:20px 16px;">
    <div style="font-size:34px;">🗺️</div>
    <div style="flex:1;"><div style="font-size:19px;font-weight:700;color:var(--ink);">做攻略</div><div class="muted" style="margin-top:4px;">选好目的地，自动生成 Day-by-Day 行程</div></div>
    <div class="arrow">›</div>
  </div>
  <div class="card" style="border-left:4px solid #2bb3c0;display:flex;align-items:center;gap:14px;padding:20px 16px;">
    <div style="font-size:34px;">🤝</div>
    <div style="flex:1;"><div style="font-size:19px;font-weight:700;color:var(--ink);">找搭子</div><div class="muted" style="margin-top:4px;">发布路线，匹配同期同路线的旅伴</div></div>
    <div class="arrow">›</div>
  </div>
</div>
<div class="sec-title">最新找搭子<span class="more">查看全部 ›</span></div>
<div style="display:flex;gap:12px;overflow:hidden;">
  <div class="card" style="width:180px;flex-shrink:0;margin:0;"><div style="font-weight:700;font-size:15px;">苏黎世·因特拉肯·卢塞恩</div><div style="color:var(--brand);font-size:12px;font-weight:600;margin:8px 0 5px;">2026-08-15 · 7天</div><div class="muted">Luna · 2/4人</div></div>
  <div class="card" style="width:180px;flex-shrink:0;margin:0;"><div style="font-weight:700;font-size:15px;">东京·京都·大阪</div><div style="color:var(--brand);font-size:12px;font-weight:600;margin:8px 0 5px;">2026-09-01 · 8天</div><div class="muted">阿May · 1/3人</div></div>
</div>
<div style="display:flex;gap:12px;margin-top:16px;">
  <div class="card" style="flex:1;text-align:center;margin:0;"><div style="font-size:24px;">🔍</div><div class="muted" style="margin-top:6px;">大家都去哪</div></div>
  <div class="card" style="flex:1;text-align:center;margin:0;"><div style="font-size:24px;">👤</div><div class="muted" style="margin-top:6px;">我的行程</div></div>
</div>
`));

document.getElementById('g').innerHTML = P.join('');
</script>
</body></html>
