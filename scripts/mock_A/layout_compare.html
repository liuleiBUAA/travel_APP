<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#dfe4ea;padding:36px;}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;margin-bottom:52px;}
.rowtitle{text-align:center;font-size:19px;font-weight:800;color:#2a2a33;margin-bottom:20px;letter-spacing:.5px;}
.rowtitle .desc{display:block;font-size:13px;font-weight:500;color:#6a6a75;margin-top:6px;}
.col{display:flex;flex-direction:column;align-items:center;}
.label{font-size:14px;font-weight:700;color:#3a3a44;margin-bottom:12px;letter-spacing:.5px;}
.label.after{color:#ff6a5c;}
.phone{width:320px;height:660px;border-radius:38px;overflow:hidden;box-shadow:0 20px 46px rgba(0,0,0,.20);border:9px solid #16161a;background:#000;}
.screen{height:100%;overflow:hidden;background:#f7f8fa;position:relative;}
.sb{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:#1a1a1a;background:#f7f8fa;}
:root{ --brand:#ff6a5c; --brand-soft:#fff0ee; --ink:#1a1a1a; --sub:#666; --faint:#999; --line:#eee; }
.body{padding:16px;height:622px;overflow-y:auto;}
.body::-webkit-scrollbar{display:none;}
.h1{font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.25;}
.h1-sub{font-size:13px;color:var(--faint);margin-top:6px;}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:14px;}
.sec-title{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin:20px 2px 12px;display:flex;justify-content:space-between;align-items:center;}
.sec-title .more{font-size:12px;font-weight:500;color:var(--faint);}
.ctitle{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;}
.ctitle::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--brand);margin-right:9px;}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;background:#f2f3f5;color:var(--sub);margin:3px 5px 3px 0;}
.chip.on{background:var(--brand);color:#fff;}
.chip.soft{background:var(--brand-soft);color:var(--brand);font-weight:600;}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-size:15px;font-weight:700;background:var(--brand);color:#fff;border:none;margin-top:6px;}
.arrow{color:var(--faint);font-size:16px;}
.muted{color:var(--faint);font-size:12px;}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffd0ca,#ffb3a8);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.avatar.lg{width:72px;height:72px;font-size:34px;}
</style></head><body>
<div id="app"></div>
<script>
const sb=`<div class="sb"><span>9:41</span><span>📶 🔋</span></div>`;
function phone(l,i,after){return `<div class="col"><div class="label ${after?'after':''}">${l}</div><div class="phone"><div class="screen">${sb}<div class="body">${i}</div></div></div></div>`;}
function block(title,desc,before,after){return `<div class="block" style="background:#dfe4ea;padding-bottom:8px;"><div class="rowtitle">${title}<span class="desc">${desc}</span></div><div class="row">${phone("改前（现状）",before,false)}${phone("改后（布局优化）",after,true)}</div></div>`;}
const R=[];

/* ========== 1. 首页 ========== */
const home_before=`
<div style="padding:8px 2px 0;"><div class="h1">你好，浩然 👋</div><div class="h1-sub">下一段旅程，从这里开始</div></div>
<div style="margin-top:20px;display:flex;gap:12px;">
  <div class="card" style="flex:1;text-align:center;margin:0;padding:20px 12px;"><div style="font-size:30px;">🗺️</div><div style="font-weight:700;margin-top:8px;">做攻略</div></div>
  <div class="card" style="flex:1;text-align:center;margin:0;padding:20px 12px;"><div style="font-size:30px;">🤝</div><div style="font-weight:700;margin-top:8px;">找搭子</div></div>
</div>
<div class="sec-title">最新找搭子<span class="more">查看全部 ›</span></div>
<div class="card" style="display:flex;align-items:center;gap:12px;"><div class="avatar">🧑</div><div style="flex:1;"><div style="font-weight:700;">苏黎世·因特拉肯·卢塞恩</div><div class="muted" style="margin-top:4px;">Luna · 2/4人 · 2026-08-15</div></div></div>
<div class="card" style="display:flex;align-items:center;gap:12px;"><div class="avatar">🧑</div><div style="flex:1;"><div style="font-weight:700;">东京·京都·大阪</div><div class="muted" style="margin-top:4px;">阿May · 1/3人 · 2026-09-01</div></div></div>`;

const home_after=`
<div style="padding:8px 2px 0;display:flex;justify-content:space-between;align-items:center;">
  <div><div class="h1" style="font-size:23px;">你好，浩然 👋</div><div class="h1-sub">下一段旅程，从这里开始</div></div>
  <div class="avatar" style="width:44px;height:44px;font-size:20px;">🧑</div>
</div>
<!-- 主入口：一大一小，主次分明 -->
<div style="margin-top:20px;">
  <div style="border-radius:18px;padding:22px 18px;background:linear-gradient(120deg,#ff8a5c,#ff5c72);color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(255,90,100,.28);">
    <div style="font-size:34px;">🗺️</div>
    <div style="font-size:20px;font-weight:800;margin-top:8px;">做攻略</div>
    <div style="font-size:12px;opacity:.92;margin-top:4px;">选好目的地，自动生成 Day-by-Day 行程</div>
    <div style="position:absolute;right:-10px;bottom:-14px;font-size:90px;opacity:.14;">🗺️</div>
  </div>
  <div class="card" style="display:flex;align-items:center;gap:14px;margin:14px 0 0;padding:18px 16px;">
    <div style="width:46px;height:46px;border-radius:13px;background:#e8f7f9;display:flex;align-items:center;justify-content:center;font-size:24px;">🤝</div>
    <div style="flex:1;"><div style="font-size:16px;font-weight:700;">找搭子</div><div class="muted" style="margin-top:3px;">发布路线，匹配同期同路线旅伴</div></div><div class="arrow">›</div>
  </div>
</div>
<div class="sec-title">最新找搭子<span class="more">查看全部 ›</span></div>
<div class="card" style="display:flex;align-items:center;gap:12px;padding:14px;">
  <div class="avatar">🧑</div>
  <div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:15px;">苏黎世·因特拉肯·卢塞恩</div>
    <div style="margin:6px 0 4px;"><span class="chip soft" style="margin:0;">🇨🇭 瑞士</span><span class="chip" style="margin:0 0 0 4px;">7天</span></div>
    <div class="muted">Luna · 还差 2 人</div></div>
  <div style="text-align:center;"><div style="font-size:12px;color:var(--brand);font-weight:700;">08-15</div><div class="muted" style="font-size:10px;">出发</div></div>
</div>
<div class="card" style="display:flex;align-items:center;gap:12px;padding:14px;">
  <div class="avatar">🧑</div>
  <div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:15px;">东京·京都·大阪</div>
    <div style="margin:6px 0 4px;"><span class="chip soft" style="margin:0;">🇯🇵 日本</span><span class="chip" style="margin:0 0 0 4px;">8天</span></div>
    <div class="muted">阿May · 还差 2 人</div></div>
  <div style="text-align:center;"><div style="font-size:12px;color:var(--brand);font-weight:700;">09-01</div><div class="muted" style="font-size:10px;">出发</div></div>
</div>`;
R.push(block("① 首页","主入口从「两个对称小方块」→「一大一小」，做攻略是核心动作放大做主视觉；列表卡加国旗标签+出发日，信息更丰富","改前"+home_before, home_after));

/* ========== 2. 列表卡片（搜搭子结果） ========== */
const list_before=`
<div class="sec-title" style="margin-top:8px;">找到 3 位同路旅伴</div>
${[['Luna','苏黎世·因特拉肯·卢塞恩','2026-08-15 · 7天','92'],['大熊','采尔马特·苏黎世','2026-08-18 · 6天','85'],['小鹿','日内瓦·蒙特勒','2026-08-20 · 5天','78']].map(x=>`
<div class="card" style="display:flex;align-items:center;gap:12px;">
  <div class="avatar">🧑</div>
  <div style="flex:1;"><div style="font-weight:700;font-size:15px;">${x[0]}</div><div style="font-size:13px;margin:3px 0;">${x[1]}</div><div class="muted">${x[2]}</div></div>
  <div style="text-align:center;"><div style="font-size:22px;font-weight:800;color:var(--brand);">${x[3]}</div><div class="muted">匹配分</div></div>
</div>`).join('')}`;

const list_after=`
<div class="sec-title" style="margin-top:8px;">找到 3 位同路旅伴</div>
${[['Luna','苏黎世·因特拉肯·卢塞恩','08-15','7','92',['拼房','结伴同游'],'🇨🇭'],['大熊','采尔马特·苏黎世','08-18','6','85',['拼车','摄影搭子'],'🇨🇭'],['小鹿','日内瓦·蒙特勒','08-20','5','78',['结伴同游'],'🇨🇭']].map(x=>`
<div class="card" style="padding:16px;">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="avatar">🧑</div>
    <div style="flex:1;"><div style="font-weight:700;font-size:16px;">${x[0]}</div><div class="muted" style="margin-top:2px;">${x[6]} ${x[1]}</div></div>
    <div style="background:var(--brand-soft);border-radius:12px;padding:6px 12px;text-align:center;"><div style="font-size:20px;font-weight:800;color:var(--brand);line-height:1;">${x[4]}</div><div style="font-size:10px;color:var(--brand);margin-top:2px;">匹配</div></div>
  </div>
  <div style="display:flex;gap:20px;margin:12px 0 10px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
    <div><div class="muted" style="font-size:10px;">出发</div><div style="font-weight:700;font-size:14px;">${x[2]}</div></div>
    <div><div class="muted" style="font-size:10px;">天数</div><div style="font-weight:700;font-size:14px;">${x[3]}天</div></div>
  </div>
  <div>${x[5].map(t=>`<span class="chip" style="margin:0 6px 0 0;">${t}</span>`).join('')}</div>
</div>`).join('')}`;
R.push(block("② 列表卡片（搜搭子结果）","从「一行行平铺」→「信息卡片」：匹配分做成醒目角标，出发/天数做数据条，加搭子类型标签。密度更高、更像内容而非表格","改前"+list_before, list_after));

/* ========== 3. 行程详情 ========== */
const detail_before=`
<div style="height:130px;background:linear-gradient(135deg,#7fb3d5,#5499c7);border-radius:14px;"></div>
<div style="padding:14px 2px 0;">
  <div style="font-size:20px;font-weight:800;">苏黎世·因特拉肯·卢塞恩</div>
  <div style="margin:10px 0;"><span class="chip">7天</span><span class="chip">2026-08-15</span><span class="chip">2/4人</span></div>
</div>
<div class="card" style="display:flex;align-items:center;gap:12px;"><div class="avatar">🧑</div><div><div style="font-weight:700;">Luna</div><div class="muted">发布者</div></div></div>
<div class="ctitle" style="margin-top:6px;">Day 1 · 苏黎世</div>
<div class="card"><div class="muted">抵达苏黎世，班霍夫大街 + 苏黎世湖漫步</div></div>`;

const detail_after=`
<div style="position:relative;height:190px;border-radius:0;margin:-16px -16px 0;background:linear-gradient(135deg,#7fb3d5,#5499c7);overflow:hidden;">
  <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%);"></div>
  <div style="position:absolute;left:16px;bottom:14px;color:#fff;">
    <div style="font-size:22px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.3);">苏黎世·因特拉肯·卢塞恩</div>
    <div style="font-size:12px;opacity:.95;margin-top:4px;">🇨🇭 瑞士 · 经典雪山湖泊线</div>
  </div>
</div>
<!-- 关键信息数据条 -->
<div style="display:flex;background:#fff;border-radius:16px;padding:16px 0;margin:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.05);">
  <div style="flex:1;text-align:center;border-right:1px solid var(--line);"><div style="font-size:18px;font-weight:800;">7</div><div class="muted" style="font-size:10px;">天</div></div>
  <div style="flex:1;text-align:center;border-right:1px solid var(--line);"><div style="font-size:14px;font-weight:800;">08-15</div><div class="muted" style="font-size:10px;">出发</div></div>
  <div style="flex:1;text-align:center;"><div style="font-size:18px;font-weight:800;color:var(--brand);">2/4</div><div class="muted" style="font-size:10px;">已组队</div></div>
</div>
<div class="card" style="display:flex;align-items:center;gap:12px;"><div class="avatar">🧑</div><div style="flex:1;"><div style="font-weight:700;">Luna</div><div class="muted">发布者 · 想找拼房搭子</div></div><div style="background:var(--brand);color:#fff;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;">申请同行</div></div>
<div class="ctitle" style="margin-top:6px;">行程安排</div>
<div class="card" style="padding:0;overflow:hidden;">
  <div style="display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line);"><div style="width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">1</div><div><div style="font-weight:700;font-size:14px;">苏黎世</div><div class="muted" style="margin-top:3px;">班霍夫大街 + 苏黎世湖漫步</div></div></div>
  <div style="display:flex;gap:12px;padding:14px;"><div style="width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">2</div><div><div style="font-weight:700;font-size:14px;">因特拉肯</div><div class="muted" style="margin-top:3px;">少女峰观光，雪山缆车</div></div></div>
</div>`;
R.push(block("③ 行程详情","头图从「矮色块」→「大图+标题压图上」；关键信息（天数/出发/组队）做成一排数据条；行程用时间轴节点串起来，更像专业行程单","改前"+detail_before, detail_after));

/* ========== 4. 我的 ========== */
const profile_before=`
<div style="text-align:center;padding:20px 0;">
  <div class="avatar" style="margin:0 auto;width:72px;height:72px;font-size:34px;">🧑</div>
  <div style="font-weight:800;font-size:18px;margin-top:10px;">浩然</div>
</div>
${['🗺️ 我的行程','🤝 我的搭子','📇 我的名片','⚙️ 设置'].map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:16px;"><span>${x}</span><span class="arrow">›</span></div>`).join('')}
<div class="card" style="text-align:center;color:var(--faint);">退出登录</div>`;

const profile_after=`
<!-- 名片头 -->
<div class="card" style="padding:22px 18px;background:linear-gradient(135deg,#fff,#fff7f5);">
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="avatar lg">🧑</div>
    <div style="flex:1;"><div style="font-weight:800;font-size:20px;">浩然</div><div class="muted" style="margin-top:4px;">爱自由行 · 会拍照 · 想去瑞士看雪山</div></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;">
    <span class="chip soft" style="margin:0;">📷 摄影搭子</span><span class="chip soft" style="margin:0;">🏔️ 户外</span><span class="chip" style="margin:0;">🍜 觅食</span>
  </div>
  <div style="display:flex;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">
    <div style="flex:1;text-align:center;"><div style="font-weight:800;font-size:18px;">3</div><div class="muted" style="font-size:11px;">发布</div></div>
    <div style="flex:1;text-align:center;"><div style="font-weight:800;font-size:18px;">5</div><div class="muted" style="font-size:11px;">搭子</div></div>
    <div style="flex:1;text-align:center;"><div style="font-weight:800;font-size:18px;">2</div><div class="muted" style="font-size:11px;">行程</div></div>
  </div>
</div>
${['🗺️ 我的行程','🤝 我的搭子','📇 我的名片','⚙️ 设置'].map(x=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:10px;"><span style="font-weight:500;">${x}</span><span class="arrow">›</span></div>`).join('')}
<div style="text-align:center;color:var(--faint);font-size:13px;margin-top:8px;">退出登录</div>`;
R.push(block("④ 我的","顶部从「居中小头像」→「名片头卡片」：头像+签名+兴趣标签+发布/搭子/行程数据，个人存在感更强","改前"+profile_before, profile_after));

document.getElementById('app').innerHTML=R.join('');
</script></body></html>
