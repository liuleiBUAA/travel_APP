<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC",sans-serif}
body{background:#f2f3f5;width:375px;margin:0 auto}
.nav{background:#fff;padding:12px 16px;font-size:17px;font-weight:600;text-align:center;border-bottom:1px solid #eee}
.sbar{background:#fff;padding:12px 16px;position:sticky;top:0}
.sbox{display:flex;align-items:center;background:#f2f3f5;border-radius:20px;padding:8px 14px}
.sbox .ic{color:#999;margin-right:8px}
.sbox input{border:0;background:none;outline:none;font-size:14px;flex:1;color:#333}
.hint{padding:8px 16px;color:#999;font-size:12px}
.card{background:#fff;margin:8px 16px;border-radius:12px;overflow:hidden;display:flex;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card img{width:96px;height:96px;object-fit:cover;flex-shrink:0}
.cbody{padding:10px 12px;flex:1;min-width:0}
.ctag{display:inline-block;font-size:10px;color:#0099cc;background:#e6f7fc;border-radius:4px;padding:1px 6px;margin-bottom:4px}
.cname{font-size:15px;font-weight:600;color:#222;margin-bottom:3px}
.cmeta{font-size:11px;color:#999;margin-bottom:4px}
.csum{font-size:12px;color:#666;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arrow{align-self:center;color:#ccc;padding-right:10px}
</style></head><body>
<div class="nav">攻略</div>
<div class="sbar"><div class="sbox"><span class="ic">🔍</span><input value="瑞吉山" readonly></div></div>
<div class="hint">找到 1 个结果</div>
<div class="card">
  <img src="../travel_guide/data/images/瑞士/卢塞恩/瑞吉山_1.jpg">
  <div class="cbody">
    <span class="ctag">景点详情</span>
    <div class="cname">瑞吉山 Rigi</div>
    <div class="cmeta">瑞士 · 卢塞恩</div>
    <div class="csum">山峦皇后，欧洲最早的齿轨登山铁路，360°俯瞰阿尔卑斯群峰与琉森湖。</div>
  </div>
  <span class="arrow">›</span>
</div>
<div class="hint" style="margin-top:16px">— 试试搜「湖」—</div>
<div class="card">
  <img src="../travel_guide/data/images/瑞士/因特拉肯/蓝湖自然公园_1.jpg">
  <div class="cbody"><span class="ctag">景点详情</span><div class="cname">蓝湖自然公园</div><div class="cmeta">瑞士 · 因特拉肯</div><div class="csum">清澈见底的蓝绿色湖泊，玻璃底船、鳟鱼养殖与森林步道。</div></div><span class="arrow">›</span>
</div>
<div class="card">
  <img src="../travel_guide/data/images/德国/国王湖/国王湖_1.jpg">
  <div class="cbody"><span class="ctag">城市攻略</span><div class="cname">国王湖</div><div class="cmeta">德国 · 贝希特斯加登</div><div class="csum">德国最深最干净的湖泊，峡湾般的山水，红顶圣巴托洛梅教堂。</div></div><span class="arrow">›</span>
</div>
</body></html>
